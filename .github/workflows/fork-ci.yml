# Fork CI: tests the Firstmate fork's own code and its two upstream
# integration points. It never runs upstream's test suite; upstream's own
# workflow (ci.yml) is unchanged and owns upstream regression. See fork/README
# "Testing ownership". Its first step also guards the workflow list itself:
# if any workflow outside the allowlist (fork-ci.yml,
# no-mistakes-required.yml, windows-herdr-spike.yml) is active on the
# repository - a re-enabled ci.yml or a workflow an upstream sync installed -
# the run fails and names it, so upstream's suite can never come back by
# accident (fork/bin/fm-fork-workflow-guard).
name: Fork CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fork/**'

permissions:
  contents: read
  # actions: read lets the workflow-guard step list this repository's
  # workflows so it can fail while a non-allowlisted one is active.
  actions: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork:
    name: Fork policy and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Only allowlisted workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        run: fork/bin/fm-fork-workflow-guard
      - name: Install pinned ShellCheck
        run: |
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint fork code and the two hooked upstream files
        run: fork/bin/fm-fork-sync lint
      - name: Upstream-owned files differ only by the two hook blocks
        run: |
          git fetch --no-tags --quiet https://github.com/kunchenguid/firstmate main
          fork/bin/fm-fork-hook-check --base "$(git merge-base HEAD FETCH_HEAD)"
      - name: Fork test suite
        run: fork/tests/run
